<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promocam Чекер</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
  h1 { text-align: center; margin-bottom: 20px; color: #333; }
  .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  label { font-weight: bold; display: block; margin-bottom: 8px; color: #555; }
  .materials { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .materials label { font-weight: normal; display: flex; align-items: center; gap: 6px; cursor: pointer; background: #f5f5f5; padding: 8px 14px; border-radius: 20px; border: 2px solid transparent; }
  .materials input[type=checkbox]:checked + span { color: #1a73e8; }
  .materials label:has(input:checked) { border-color: #1a73e8; background: #e8f0fe; }
  input[type=file] { width: 100%; padding: 12px; border: 2px dashed #ccc; border-radius: 8px; cursor: pointer; }
  button#startBtn { width: 100%; padding: 14px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
  button#startBtn:disabled { background: #aaa; cursor: not-allowed; }
  #status { text-align: center; padding: 12px; color: #555; font-size: 14px; }
  .progress-bar { height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; margin: 8px 0; }
  .progress-fill { height: 100%; background: #1a73e8; transition: width 0.3s; }
  .section-title { font-size: 18px; font-weight: bold; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #f0f0f0; }
  .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .photo-item { border-radius: 8px; overflow: hidden; border: 3px solid #ccc; position: relative; }
  .photo-item.ok { border-color: #34a853; }
  .photo-item.fail { border-color: #ea4335; }
  .photo-item.dup { border-color: #fbbc04; }
  .photo-item img { width: 100%; height: 120px; object-fit: cover; display: block; }
  .photo-label { padding: 6px 8px; font-size: 12px; font-weight: bold; }
  .ok .photo-label { background: #e6f4ea; color: #137333; }
  .fail .photo-label { background: #fce8e6; color: #c5221f; }
  .dup .photo-label { background: #fef7e0; color: #b45309; }
  .stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat { flex: 1; min-width: 100px; text-align: center; padding: 12px; border-radius: 8px; }
  .stat.ok { background: #e6f4ea; color: #137333; }
  .stat.fail { background: #fce8e6; color: #c5221f; }
  .stat.dup { background: #fef7e0; color: #b45309; }
  .stat-num { font-size: 28px; font-weight: bold; }
  .stat-label { font-size: 13px; }
  #results { display: none; }
</style>
</head>
<body>
<h1>📸 Promocam Чекер</h1>

<div class="card">
  <label>1. Выбери материалы которые были на маршруте:</label>
  <div class="materials">
    <label><input type="checkbox" value="D1"><span>D1</span></label>
    <label><input type="checkbox" value="D2"><span>D2</span></label>
    <label><input type="checkbox" value="D3"><span>D3</span></label>
    <label><input type="checkbox" value="Menu"><span>Menu</span></label>
    <label><input type="checkbox" value="Ne_Moet"><span>Не Моет</span></label>
    <label><input type="checkbox" value="Okna"><span>Окна</span></label>
    <label><input type="checkbox" value="Vizitka"><span>Визитка</span></label>
    <label><input type="checkbox" value="krokodil"><span>Крокодил</span></label>
    <label><input type="checkbox" value="musor"><span>Мусор</span></label>
  </div>

  <label>2. Загрузи фото с маршрута:</label>
  <input type="file" id="fileInput" accept="image/*" multiple style="margin-bottom:16px">

  <button id="startBtn" onclick="startCheck()">🚀 Начать проверку</button>
  <div id="status"></div>
  <div class="progress-bar" id="progressBar" style="display:none"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
</div>

<div id="results">
  <div class="card">
    <div class="section-title">📊 Итог</div>
    <div class="stats">
      <div class="stat ok"><div class="stat-num" id="countOk">0</div><div class="stat-label">✅ Найден</div></div>
      <div class="stat fail"><div class="stat-num" id="countFail">0</div><div class="stat-label">❌ Не найден</div></div>
      <div class="stat dup"><div class="stat-num" id="countDup">0</div><div class="stat-label">🔁 Дубли</div></div>
    </div>
  </div>

  <div class="card" id="failSection" style="display:none">
    <div class="section-title">❌ Материал не найден</div>
    <div class="photo-grid" id="failGrid"></div>
  </div>

  <div class="card" id="dupSection" style="display:none">
    <div class="section-title">🔁 Дубли</div>
    <div class="photo-grid" id="dupGrid"></div>
  </div>

  <div class="card">
    <div class="section-title">✅ Всё найдено</div>
    <div class="photo-grid" id="okGrid"></div>
  </div>
</div>

<script>
let session = null;
const MODEL_URL = 'https://promocam.troeglazoofjob.workers.dev/model';
const INPUT_SIZE = 640;
const CLASSES = ['D1','D2','D3','Menu','Ne_Moet','Okna','Vizitka','krokodil','musor'];
const CONF_THRESHOLD = 0.6;

async function loadModel() {
  setStatus('⏳ Загружаем модель...');
  const resp = await fetch(MODEL_URL);
  const buffer = await resp.arrayBuffer();
  session = await ort.InferenceSession.create(buffer, { executionProviders: ['wasm'] });
  setStatus('✅ Модель готова');
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }
function setProgress(p) {
  document.getElementById('progressBar').style.display = 'block';
  document.getElementById('progressFill').style.width = p + '%';
}

async function preprocessImage(file) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = INPUT_SIZE; canvas.height = INPUT_SIZE;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#808080';
      ctx.fillRect(0, 0, INPUT_SIZE, INPUT_SIZE);
      const scale = Math.min(INPUT_SIZE / img.width, INPUT_SIZE / img.height);
      const w = img.width * scale, h = img.height * scale;
      const x = (INPUT_SIZE - w) / 2, y = (INPUT_SIZE - h) / 2;
      ctx.drawImage(img, x, y, w, h);
      const data = ctx.getImageData(0, 0, INPUT_SIZE, INPUT_SIZE).data;
      const tensor = new Float32Array(3 * INPUT_SIZE * INPUT_SIZE);
      for (let i = 0; i < INPUT_SIZE * INPUT_SIZE; i++) {
        tensor[i] = data[i*4] / 255;
        tensor[INPUT_SIZE*INPUT_SIZE + i] = data[i*4+1] / 255;
        tensor[2*INPUT_SIZE*INPUT_SIZE + i] = data[i*4+2] / 255;
      }
      resolve(new ort.Tensor('float32', tensor, [1, 3, INPUT_SIZE, INPUT_SIZE]));
    };
    img.src = URL.createObjectURL(file);
  });
}

async function detectFile(file) {
  const tensor = await preprocessImage(file);
  const output = await session.run({ images: tensor });
  const data = output[Object.keys(output)[0]].data;
  const numDet = data.length / (4 + CLASSES.length);
  const found = new Set();
  for (let i = 0; i < numDet; i++) {
    const offset = i * (4 + CLASSES.length);
    let maxConf = 0, maxCls = -1;
    for (let c = 0; c < CLASSES.length; c++) {
      if (data[offset + 4 + c] > maxConf) { maxConf = data[offset + 4 + c]; maxCls = c; }
    }
    if (maxConf > CONF_THRESHOLD) found.add(CLASSES[maxCls]);
  }
  return found;
}

async function imageHash(file) {
  const buf = await file.arrayBuffer();
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('').slice(0,16);
}

function addPhoto(grid, file, label) {
  const div = document.createElement('div');
  div.className = 'photo-item ' + grid.id.replace('Grid','');
  const img = document.createElement('img');
  img.src = URL.createObjectURL(file);
  const lbl = document.createElement('div');
  lbl.className = 'photo-label';
  lbl.textContent = label;
  div.appendChild(img); div.appendChild(lbl);
  document.getElementById(grid.id).appendChild(div);
}

async function startCheck() {
  const files = document.getElementById('fileInput').files;
  const selected = [...document.querySelectorAll('.materials input:checked')].map(i => i.value);
  if (!files.length) return alert('Загрузи фото!');
  if (!selected.length) return alert('Выбери материалы!');

  document.getElementById('startBtn').disabled = true;
  document.getElementById('results').style.display = 'none';
  ['okGrid','failGrid','dupGrid'].forEach(id => document.getElementById(id).innerHTML = '');

  if (!session) await loadModel();

  const hashes = new Map();
  let ok = 0, fail = 0, dup = 0;

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    setStatus(`Проверяем ${i+1} из ${files.length}: ${file.name}`);
    setProgress((i+1) / files.length * 100);

    const hash = await imageHash(file);
    if (hashes.has(hash)) {
      dup++;
      addPhoto({id:'dupGrid'}, file, `🔁 ${file.name}`);
      continue;
    }
    hashes.set(hash, true);

    const found = await detectFile(file);
    const missing = selected.filter(m => !found.has(m));

    if (missing.length === 0) {
      ok++;
      addPhoto({id:'okGrid'}, file, `✅ ${file.name}`);
    } else {
      fail++;
      addPhoto({id:'failGrid'}, file, `❌ Нет: ${missing.join(', ')}`);
    }
  }

  document.getElementById('countOk').textContent = ok;
  document.getElementById('countFail').textContent = fail;
  document.getElementById('countDup').textContent = dup;
  document.getElementById('failSection').style.display = fail ? 'block' : 'none';
  document.getElementById('dupSection').style.display = dup ? 'block' : 'none';
  document.getElementById('results').style.display = 'block';
  document.getElementById('progressBar').style.display = 'none';
  setStatus('✅ Проверка завершена!');
  document.getElementById('startBtn').disabled = false;
}
</script>
</body>
</html>
